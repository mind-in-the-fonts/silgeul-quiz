<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>실용글쓰기 소책자 문제집</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#f7f7f8; --card:#ffffff; --ink:#333d4b; --muted:#6b7684; --line:#e5e8eb; --line2:#d1d6db;
  --grid:#16a06a; --grid-soft:#e7f6ef; --pen:#f04452; --pen-soft:#fff0f1;
  --ok:#00a661; --ok-soft:#e6f8ef; --bad:#f04452; --bad-soft:#fff0f1;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101012; --card:#1c1c20; --ink:#f2f4f6; --muted:#9ea6b0; --line:#2c2c33; --line2:#3a3a42;
  --grid:#3cc48c; --grid-soft:#143326; --pen:#ff6b76; --pen-soft:#3a1a1e;
  --ok:#2ecf85; --ok-soft:#12301f; --bad:#ff6b76; --bad-soft:#3a1a1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101012; --card:#1c1c20; --ink:#f2f4f6; --muted:#9ea6b0; --line:#2c2c33; --line2:#3a3a42;
  --grid:#3cc48c; --grid-soft:#143326; --pen:#ff6b76; --pen-soft:#3a1a1e;
  --ok:#2ecf85; --ok-soft:#12301f; --bad:#ff6b76; --bad-soft:#3a1a1e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;gap:16px;height:56px}
h1{font:800 17px/1 var(--f);margin:0;white-space:nowrap}
h1 .mark{color:inherit}
.sub{display:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
nav.tabs a{flex:none;padding:7px 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14.5px;border-radius:8px}
nav.tabs a:hover{background:var(--paper)}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--paper)}
@media (max-width:520px){header.top .wrap{flex-direction:column;align-items:stretch;height:auto;padding-top:12px;gap:8px}nav.tabs{margin:0 -6px;padding-bottom:8px}}
main .wrap{padding-block:24px 80px}
h2{font:700 22px/1.35 var(--f);margin:0 0 6px}
h3{font:600 13px/1.4 var(--f);margin:0 0 8px;color:var(--muted)}
section+section{margin-top:28px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn{font:600 15px/1.3 var(--f);cursor:pointer;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:11px 16px;transition:background .12s,border-color .12s,transform .06s}
button:hover{background:var(--paper)}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,textarea:focus-visible,nav.tabs a:focus-visible{outline:2px solid var(--grid);outline-offset:2px}
button.primary{background:var(--grid);border-color:var(--grid);color:#fff;padding:13px 22px}
button.primary:hover{filter:brightness(.94);background:var(--grid)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button[disabled]{opacity:.4;cursor:default;transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;font-size:14px;font-weight:500;background:var(--card);border-color:var(--line);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--grid-soft);border-color:var(--grid);color:var(--grid);font-weight:600}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip .n{color:var(--muted);font-size:12.5px;margin-left:4px;font-variant-numeric:tabular-nums}
.grp{display:grid;grid-template-columns:96px 1fr;gap:8px 14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.grp>b{font-weight:700;font-size:14.5px;padding-top:7px}
@media (max-width:520px){.grp{grid-template-columns:1fr}.grp>b{padding-top:0}}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;border-radius:9px;background:transparent;padding:8px 14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.stat{border-radius:var(--r);padding:14px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font:800 26px/1.2 var(--f);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:8px;margin:10px 0 22px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grid);width:0;border-radius:8px;transition:width .3s}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--grid-soft);color:var(--grid)}
.stem{font:700 20px/1.5 var(--f);margin:12px 0 16px}
.given{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 16px;font-size:16.5px;line-height:1.8}
.given u,.passage u{text-decoration:underline 2px var(--pen);text-underline-offset:4px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:16px;font-size:16px;font-weight:500;width:100%;border-width:2px;border-color:var(--line);border-radius:var(--r)}
.opt:hover{border-color:var(--line2);background:var(--card)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong .k{background:var(--bad);color:#fff}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{font:800 34px/1 var(--f);padding:28px;border-width:2px;border-color:var(--line);border-radius:var(--r)}
input[type=text],textarea{font:inherit;font-size:16px;width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
textarea{min-height:100px;resize:vertical;line-height:1.6}
.fb{margin-top:16px;padding:16px 18px;border-radius:var(--r);border:none;background:var(--card)}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb .verdict{font-weight:800;font-size:17px;margin-bottom:6px}
.fb.ok .verdict{color:var(--ok)} .fb.no .verdict{color:var(--bad)}
.src{font-size:13.5px;color:var(--muted);margin-top:8px}
.pair{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;margin-top:10px}
.pair dt{color:var(--muted);font-size:13px;font-weight:600;padding-top:2px}
.pair dd{margin:0;min-width:0}
.pair .b{text-decoration:line-through var(--pen);text-decoration-thickness:1.5px;color:var(--muted)}
.next{margin-top:18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.elist{display:grid;gap:8px}
.eitem{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:16px;width:100%;border-radius:var(--r);border-color:var(--line)}
.eitem small{color:var(--muted);font-weight:500}
.passage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;font-size:16.5px;line-height:1.95;margin:12px 0 16px}
.blanks{display:grid;gap:4px}
.blank{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.blank .lab{font:800 17px/1.7 var(--f);color:var(--grid)}
.blank .ans{font-size:14px;font-weight:500;margin-top:6px}
.blank .ans.ok{color:var(--ok)} .blank .ans.no{color:var(--bad)}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{padding:8px 13px;font-weight:500}
.choice button[aria-pressed="true"]{border-color:var(--grid);background:var(--grid-soft);color:var(--grid)}
.choice button.right{border-color:var(--ok);background:var(--ok-soft)}
.choice button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.model{background:var(--paper);border-radius:12px;padding:14px 16px;margin-top:10px}
.model ul{margin:6px 0 0;padding-left:18px}
.linkish{background:none;border:none;color:var(--grid);padding:4px 0;font-weight:600}
.linkish:hover{background:none;text-decoration:underline}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.b{color:var(--muted);width:45%}
.tbl td.p{width:44px;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tbl .note{display:block;font-size:13px;color:var(--muted)}
.tblwrap{overflow-x:auto}
.sym{width:64px;height:40px;color:var(--pen);flex:none}
.symrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.symbig{display:block;margin:4px auto 16px;width:150px;height:94px;color:var(--pen);background:var(--card);border:1px solid var(--line);border-radius:12px}
.empty{padding:32px 20px;border-radius:var(--r);background:var(--card);color:var(--muted);text-align:center}
.score{font:800 52px/1 var(--f);font-variant-numeric:tabular-nums;color:var(--grid)}
.tbl td.p{white-space:nowrap}
@media (max-width:560px){
  .tbl:has(td.b),.tbl:has(td.b) tbody{display:block}
  .tbl tr:has(td.b){display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:1px solid var(--line)}
  .tbl tr:has(td.b) td{display:block;padding:0;border:none;width:auto!important}
  .tbl td.b{grid-column:1;grid-row:1;font-size:14px;text-decoration:line-through var(--line2)}
  .tbl tr:has(td.b) td:not(.b):not(.p){grid-column:1/-1;grid-row:2;font-weight:600}
  .tbl td.p{grid-column:2;grid-row:1;font-size:12px}
  .stem{font-size:18px}.ox button{padding:22px}.stats{gap:6px}.stat{padding:12px}.stat b{font-size:22px}
  .opt{padding:14px}.passage,.given{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 "sentence", "before": "베트남 정부는 현재 베트남 내에서 내·외국인 관광객 등을 대상으로 곰 사육 농장에서 살아 있는 곰쓸개에 튜브를 연결하여 동남아 지역에 대한 여행 수요가 급증하고 있는 상황에서 생쓸개즙의 음용을 알선하는 사람 또는 업체에 대하여 「동물보호법」 등 관련 법률 위반혐의로 강력한 단속을 취할 예정입니다.", "after": "현재 베트남 등 동남아시아 지역 내 곰 사육 농장에서 살아 있는 곰쓸개에 튜브를 연결하여 쓸개즙을 음용하는 내외국인 관광객이 급증하고 있어, 베트남 정부는 생쓸개즙의 음용을 알선하는 사람이나 업체를 「동물보호법」 등 관련 법률 위반 혐의로 강력히 단속할 예정입니다.", "note": "", "page": "18"}, {"id": "b497", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "신종 플루 감염으로 보여짐.", "after": "신종 플루 감염으로 보임.", "note": "", "page": "18"}, {"id": "b498", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "보증 사례에 대해서는", "after": "보증 사례는", "note": "", "page": "18"}, {"id": "b499", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "의무 복무 군인에게 발병한 중증 질환은 복무관련성이 낮아도", "after": "의무 복무 군인에게 발병한 중증 질환은 복무와 관련성이 낮아도", "note": "", "page": "18"}, {"id": "b500", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "불참한 관계로", "after": "불참하였으므로", "note": "", "page": "18"}, {"id": "b501", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "불편함이 많았다.", "after": "불편이 컸다.", "note": "", "page": "18"}, {"id": "b502", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "붙임의 승인 조건을 숙지하신 후, 동 문서 접수 후", "after": "붙임의 승인 조건을 충분히 살펴보고 문서를 제출하신 뒤", "note": "", "page": "18"}, {"id": "b503", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "비교 시", "after": "비교할 때", "note": "", "page": "18"}, {"id": "b504", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "비상구 유도등은 녹색 바탕으로 되어 있고 밖으로 대피할 수 있는 출입구(바닥으로부터 1.5m 이상 높이 설치)를 표시하며, 통로 유도등은 백색 바탕에 녹색 화살표로 대피 방향(바닥으로부터 1m 이하 위치 설치)을 표시하고 있습니다.", "after": "비상구 유도등은 대피할 수 있는 출입구를 표시합니다. 녹색 바탕으로 되어 있고, 바닥에서 1.5m 이상 높은 곳에 설치되어 있습니다. 통로 유도등은 대피 방향을 표시합니다. 백색 바탕에 녹색 화살표가 그려져 있고, 바닥에서 1m 이하 낮은 곳에 설치되어 있습니다.", "note": "", "page": "18"}, {"id": "b505", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "새로운 아이디어와 구체적인 실천 계획을 세운다.", "after": "새로운 아이디어를 발굴하고 구체적인 실천 계획을 세운다.", "note": "", "pa sentence", "before": "한식을 시도하기가 힘든 경우가 있었다.", "after": "한식을 먹어 보려 해도 어려운 점이 있었다.", "note": "", "page": "21"}, {"id": "b585", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "한자배우기 및 붓글씨", "after": "한자와 붓글씨 교육", "note": "", "page": "21"}, {"id": "b586", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "한편, ○○국제우주대회는 60여개국 3,000여명의 우주관련 전문가 및 관련 업체가 참여하는 항공 우주 분야 최고의 행사로 ‘지속 가능한 평화와 발전을 위한 우주’를 주제로 열리는 이번 대회는 학술회의·전시회와는 별도로 일반 시민이 함께 즐길 수 있는 다양한 우주 축제가 진행될 예정이다.", "after": "한편, ○○국제우주대회는 ‘지속 가능한 평화와 발전을 위한 우주’를 주제로 60여 개국 3,000여 명의 우주 관련 전문가와 관련 업체가 참여하는 행사이다. 이번 대회에서는 학술회의·전시회와는 별도로 일반 시민이 함께 즐길 수 있는 다양한 우주 축전도 함께 열린다.", "note": "", "page": "21"}, {"id": "b587", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "합리적 조정해", "after": "합리적으로 조정해", "note": "", "page": "21"}, {"id": "b588", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "행사 진행은 사회 복무 요원들의 미담 사례와 사회 복무 제도 전반에 대해 궁금한 점 등을 자유롭게 묻고 답하는 방식으로 이루어졌다.", "after": "행사는 사회 복무 요원들의 미담 사례를 나누고, 사회 복무 제도의 궁금한 점 등을 자유롭게 묻고 답하는 방식으로 진행되었다.", "note": "", "page": "21"}, {"id": "b589", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "향후 감사 시", "after": "앞으로 감사할 때", "note": "", "page": "21"}, {"id": "b590", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "현장 방문을 통한 지속적인 자율화 과제 발굴", "after": "현장 방문으로 지속적인 자율화 과제 발굴", "note": "", "page": "21"}, {"id": "b591", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "현장에서 필요로 하는", "after": "현장에서 필요한", "note": "", "page": "21"}, {"id": "b592", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "현행 규정에 대한 교육 기준 및 시점과", "after": "현행 규정의 교육 기준과 교육 시점, 그리고", "note": "", "page": "21"}, {"id": "b593", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "협력 회의 관련, ○○부는", "after": "협력 회의와 관련하여, ○○부는", "note": "", "page": "22"}, {"id": "b594", "group": "문장 다듬기", "cat": "표현", "mode": "sentence", "before": "협력을 지속 추진하여", "after": "협력을 지속적으로 추진하여", "note": "", "page": "22"}, {"id": "b5  "before": "무데뽀", "after": "막무가내", "note": "", "page": "27"}, {"id": "b741", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "잇빠이", "after": "가득, 한껏, 많이, 가득들이", "note": "", "page": "27"}, {"id": "b742", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "곤조", "after": "고집, 근성", "note": "", "page": "27"}, {"id": "b743", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "기스", "after": "흠, 흠집", "note": "", "page": "27"}, {"id": "b744", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "분빠이하다", "after": "분배, 노느매기", "note": "", "page": "27"}, {"id": "b745", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "사시미", "after": "생선회", "note": "", "page": "27"}, {"id": "b746", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "와꾸", "after": "틀", "note": "", "page": "27"}, {"id": "b747", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "지리", "after": "맑은탕, 싱건탕", "note": "", "page": "27"}, {"id": "b748", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "보로터지다", "after": "드러나다, 들통나다", "note": "", "page": "27"}, {"id": "b749", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "비까번쩍하다", "after": "번쩍번쩍하다", "note": "", "page": "27"}, {"id": "b750", "group": "다듬은 말", "cat": "일본어 투", "mode": "refine", "before": "삑사리", "after": "실수, 음 이탈, 헛발질", "note": "", "page": "27"}], "essay": [{"id": "e-a1", "type": "set", "cat": "낱말 고르기", "title": "다음 글의 ㉠~㉤에 쓸 알맞은 말을 고르시오.", "passage": "○○시는 초일류 도시에 ㉠(걸맞는/걸맞은) 보행 환경을 만들기 위해 정비 사업을 추진한다. 시는 향토 기업㉡(으로써/으로서) 책임을 다하는 업체들과 협약을 맺고, 올해 사업비를 ㉢(전년대비/전년 대비) 20% 늘렸다. 공사 기간에는 공사 구간 출입을 ㉣(일체/일절) 금지하며, 현장 주변에서의 흡연은 ㉤(삼가하여/삼가) 주시기 바란다.", "blanks": [{"label": "㉠", "options": ["걸맞는", "걸맞은"], "answer": 1, "explain": "'걸맞다'는 형용사라 '-은'이 붙어 '걸맞은'이 됩니다. (어미 오류, p.6)"}, {"label": "㉡", "options": ["으로써", "으로서"], "answer": 1, "explain": "자격을 나타낼 때는 '-으로서'. (맞춤법, p.9)"}, {"label": "㉢", "options": ["전년대비", "전년 대비"], "answer": 1, "explain": "'전년 대비'로 띄어 씁니다. (→ 지난해보다) (띄어쓰기, p.11·14)"}, {"label": "㉣", "options": ["일체", "일절"], "answer": 1, "explain": "'전혀'의 뜻으로 쓸 때는 '일절'. (낱말, p.14)"}, {"label": "㉤", "options": ["삼가하여", "삼가"], "answer": 1, "explain": "기본형이 '삼가다'라 '삼가 주시기'. (맞춤법, p.9)"}]}, {"id": "e-a2", "type": "set", "cat": "낱말 고르기", "title": "다음 글의 ㉠~㉤에 쓸 알맞은 말을 고르시오.", "passage": "올해 지역 ㉠(실업율/실업률)은 지난해보다 낮아졌지만 업종별 ㉡(증감율/증감률)을 보면 차이가 컸다. ㉢(회계 년도/회계 연도) 결산 결과 업종별 고용 지표의 ㉣(최소값/최솟값)은 3.1%였으며, 조사에 참여한 업체의 ㉤(갯수/개수)는 120곳이었다.", "blanks": [{"label": "㉠", "options": ["실업율", "실업률"], "answer": 1, "explain": "모음이나 ㄴ 받침 뒤에서만 '율'. '실업'은 ㅂ 받침이라 '률'. (p.9)"}, {"label": "㉡", "options": ["증감율", "증감률"], "answer": 1, "explain": "'증감'은 ㅁ 받침이라 '률'. (두음 법칙, p.7)"}, {"label": "㉢", "options": ["회계 년도", "회계 연도"], "answer": 1, "explain": "단어 첫머리는 두음 법칙에 따라 '연도'. (p.7)"}, {"label": "㉣", "options": ["최소값", "최솟값"], "answer": 1, "explain": "사이시옷을 넣어 '최솟값'. (p.7)"}, {"label": "㉤", "options": ["갯수", "개수"], "answer": 1, "explain": "한자어 '개수(個數)'에는 사이시옷을 넣지 않습니다. (p.9)"}]}, {"id": "e-a3", "type": "set", "cat": "낱말 고르기", "title": "다음 글의 ㉠~㉤을 외래어 표기법에 맞게 고르시오.", "passage": "신입 사원 ㉠(워크샵/워크숍)에서는 업무용 ㉡(어플리케이션/애플리케이션) 사용법과 홍보 ㉢(컨텐츠/콘텐츠) 제작 방법을 배운다. 세부 ㉣(스케쥴/스케줄)은 사내 ㉤(메세지/메시지)로 안내한다.", "blanks": [{"label": "㉠", "options": ["워크샵", "워크숍"], "answer": 1, "explain": "워크숍(→ 공동 연수, 공동 수련). (p.8·14)"}, {"label": "㉡", "options": ["어플리케이션", "애플리케이션"], "answer": 1, "explain": "p.8 외래어 표기"}, {"label": "㉢", "options": ["컨텐츠", "콘텐츠"], "answer": 1, "explain": "p.8 외래어 표기"}, {"label": "㉣", "options": ["스케쥴", "스케줄"], "answer": 1, "explain": "p.8 외래어 표기"}, {"label": "㉤", "options": ["메세지", "메시지"], "answer": 1, "explain": "p.8 외래어 표기"}]}, {"id": "e-a4", "type": "set", "cat": "낱말 고르기", "title": "다음 글의 ㉠~㉤ 가운데 띄어쓰기가 바른 것을 고르시오.", "passage": "㉠(그 동안/그동안) 협조해 주신 덕분에 사업이 ㉡(차질없이/차질 없이) 마무리되었습니다. 결과 보고서는 ㉢(10월초/10월 초)에 배포할 예정이며, ㉣(15세이상/15세 이상) 이용자를 대상으로 ㉤(2개월 간/2개월간) 만족도 조사를 실시합니다.", "blanks": [{"label": "㉠", "options": ["그 동안", "그동안"], "answer": 1, "explain": "'그동안'은 한 단어. (p.10)"}, {"label": "㉡", "options": ["차질없이", "차질 없이"], "answer": 1, "explain": "(p.11)"}, {"label": "㉢", "options": ["10월초", "10월 초"], "answer": 1, "explain": "(p.9)"}, {"label": "㉣", "options": ["15세이상", "15세 이상"], "answer": 1, "explain": "(p.9)"}, {"label": "㉤", "options": ["2개월 간", "2개월간"], "answer": 1, "explain": "기간을 나타내는 '-간'은 접미사라 붙여 씁니다. (p.9)"}]}, {"id": "e-a5", "type": "set", "cat": "낱말 고르기", "title": "다음 글의 ㉠~㉤ 가운데 띄어쓰기가 바른 것을 고르시오.", "passage": "회의 결과를 ㉠(알려드립니다/알려 드립니다). 위원들은 제도를 개선해야 ㉡(한다는데/한다는 데) 의견을 같이하였으며, 시범 사업을 ㉢(시행한바/시행한 바) 있는 ○○시의 사례를 참고하기로 하였습니다. 세부 계획은 이달 중 발표할 ㉣(계획인 바/계획인바), 관계 기관에서는 현재 ㉤(사용중인/사용 중인) 시스템을 미리 점검해 주시기 바랍니다.", "blanks": [{"label": "㉠", "options": ["알려드립니다", "알려 드립니다"], "answer": 1, "explain": "(p.11)"}, {"label": "㉡", "options": ["한다는데", "한다는 데"], "answer": 1, "explain": "'데'가 '것, 일'을 뜻하는 의존 명사라 띄어 씁니다. (p.12)"}, {"label": "㉢", "options": ["시행한바", "시행한 바"], "answer": 1, "explain": "'~한 바 있다'의 '바'는 의존 명사. (p.11)"}, {"label": "㉣", "options": ["계획인 바", "계획인바"], "answer": 1, "explain": "상황을 제시하는 어미 '-ㄴ바'는 붙여 씁니다. (→ 계획입니다. 이에) (p.10·16)"}, {"label": "㉤", "options": ["사용중인", "사용 중인"], "answer": 1, "explain": "(p.10)"}]}, {"id": "e-a6", "type": "set", "cat": "낱말 고르기", "title": "다음 글의 ㉠~㉤에 쓸 알맞은 말을 고르시오.", "passage": "직원들은 ㉠(일사분란하게/일사불란하게) 움직여 해외 시장에 첫발을 ㉡(내딛었다/내디뎠다). 고객 정보를 ㉢(꼼꼼이/꼼꼼히) 확인하고 ㉣(의심스런/의심스러운) 거래는 즉시 보고했다. 그 과정은 결코 ㉤(녹록치/녹록지) 않았다.", "blanks": [{"label": "㉠", "options": ["일사분란하게", "일사불란하게"], "answer": 1, "explain": "(오탈자, p.8)"}, {"label": "㉡", "options": ["내딛었다", "내디뎠다"], "answer": 1, "explain": "준말 '내딛다'에는 모음 어미가 붙지 않아 '내디디었다 → 내디뎠다'. (p.8)"}, {"label": "㉢", "options": ["꼼꼼이", "꼼꼼히"], "answer": 1, "explain": "(p.13)"}, {"label": "㉣", "options": ["의심스런", "의심스러운"], "answer": 1, "explain": "(p.9)"}, {"label": "㉤", "options": ["녹록치", "녹록지"], "answer": 1, "explain": "'하' 앞이 ㄱ 받침이라 '하'가 통째로 줄어 '녹록지'. (p.8 [참고])"}]}, {"id": "e-a7", "type": "set", "cat": "낱말 고르기", "title": "'-하지 않다'의 준말로 알맞은 것을 고르시오.", "passage": "준비 과정이 ㉠(익숙치/익숙지) 않아 시간이 걸렸지만 별도 비용은 ㉡(필요치/필요지) 않았다. 결과가 ㉢(탐탁치/탐탁지) 않더라도 ㉣(서슴치/서슴지) 말고 의견을 내 주십시오. 여러분의 판단을 ㉤(의심치/의심지) 않습니다.", "blanks": [{"label": "㉠", "options": ["익숙치", "익숙지"], "answer": 1, "explain": "ㄱ 받침 뒤 → '-지 않다'. (p.8)"}, {"label": "㉡", "options": ["필요치", "필요지"], "answer": 0, "explain": "모음 뒤 → '-치 않다'. (p.8)"}, {"label": "㉢", "options": ["탐탁치", "탐탁지"], "answer": 1, "explain": "ㄱ 받침 뒤 → '-지 않다'. (p.8)"}, {"label": "㉣", "options": ["서슴치", "서슴지"], "answer": 1, "explain": "기본형이 '서슴하다'가 아니라 '서슴다'라서 '서슴지'. (쏙쏙 길잡이, p.8)"}, {"label": "㉤", "options": ["의심치", "의심지"], "answer": 0, "explain": "ㅁ(유성음) 받침 뒤 → '-치 않다'. (p.8)"}]}, {"id": "e-a8", "type": "set", "cat": "낱말 고르기", "title": "괄호 뒤 조사와 가운뎃점을 바르게 쓴 것을 고르시오.", "passage": "○○원은 ㉠(전담팀(TF)를/전담팀(TF)을) 꾸려 ㉡(국내·외/국내외) 협력 사업을 추진한다. 문의는 ㉢(계약담당자(○○○ 전임)으로/계약담당자(○○○ 전임)로) 하면 되며, ㉣(유·무선/유무선) 전화나 ㉤(이메일(○○○@○○○)를/이메일(○○○@○○○)을) 이용할 수 있다.", "blanks": [{"label": "㉠", "options": ["전담팀(TF)를", "전담팀(TF)을"], "answer": 1, "explain": "조사는 괄호 앞말 '전담팀'에 맞춥니다. (p.7)"}, {"label": "㉡", "options": ["국내·외", "국내외"], "answer": 1, "explain": "한 단어로 굳은 말엔 가운뎃점을 쓰지 않습니다. (p.8)"}, {"label": "㉢", "options": ["계약담당자(○○○ 전임)으로", "계약담당자(○○○ 전임)로"], "answer": 1, "explain": "'계약담당자'는 모음으로 끝나니 '로'. (p.7)"}, {"label": "㉣", "options": ["유·무선", "유무선"], "answer": 1, "explain": "(p.8)"}, {"label": "㉤", "options": ["이메일(○○○@○○○)를", "이메일(○○○@○○○)을"], "answer": 1, "explain": "'이메일'은 ㄹ 받침이라 '을'. (p.7)"}]}, {"id": "e-a9", "type": "set", "cat": "낱말 고르기", "title": "다음 글의 ㉠~㉤에 쓸 알맞은 말을 고르시오.", "passage": "배움의 의지를 가지고 노력하시는 학습자분들㉠(에/에게) 존경을 표합니다. 군은 기업의 애로사항을 접수함㉡(을/은) 물론, 영국의 유럽연합 탈퇴에 ㉢(대비하는/대비하여) 영국과의 협력을 확대하고, 청소년 부모㉣(로써/로서) 책임을 다하는 가정도 지원할 예정입니다. 신청 서류는 작성 후 ㉤(이메일 접수/이메일로 제출)하시기 바랍니다.", "blanks": [{"label": "㉠", "options": ["에", "에게"], "answer": 1, "explain": "사람(유정 명사) 뒤에는 '에게'. (조사 오류, p.7)"}, {"label": "㉡", "options": ["을", "은"], "answer": 1, "explain": "'~함은 물론'. (조사 오류, p.7)"}, {"label": "㉢", "options": ["대비하는", "대비하여"], "answer": 1, "explain": "뒤 서술어 '확대하고'를 꾸미므로 '대비하여'. (어미 오류, p.6)"}, {"label": "㉣", "options": ["로써", "로서"], "answer": 1, "explain": "자격 → '로서'. (p.7)"}, {"label": "㉤", "options": ["이메일 접수", "이메일로 제출"], "answer": 1, "explain": "신청자 처지에서는 '제출'. 접수는 받는 쪽의 말. (어휘 사용 오류, p.6·14)"}]}, {"id": "e-b1", "type": "set", "cat": "용어 다듬기", "title": "다음 글의 일본어 투 용어 ㉠~㉤을 우리말 순화 표현으로 고쳐 쓰시오.", "passage": "• 올해도 무사히 모든 과업에 ㉠<u>종지부</u>를 찍었다.<br>• 거래 대금은 ㉡<u>익일</u> 입금되며, 통장 ㉢<u>잔고</u>는 누리집에서 확인할 수 있다.<br>• 팀원 ㉣<u>도합</u> 12명이 ㉤<u>망년회</u>에 참석했다.", "blanks": [{"label": "㉠", "accept": ["마침표"], "explain": "종지부 → 마침표 (p.27)"}, {"label": "㉡", "accept": ["다음 날", "이튿날"], "explain": "익일 → 다음 날, 이튿날 (p.27)"}, {"label": "㉢", "accept": ["잔액"], "explain": "잔고 → ① 잔액 ② 잔량. 통장이니 '잔액'. (p.27)"}, {"label": "㉣", "accept": ["모두", "합계"], "explain": "도합 → 모두, 합계 (p.27)"}, {"label": "㉤", "accept": ["송년 모임", "송년회"], "explain": "망년회 → 송년 모임, 송년회 (p.27)"}]}, {"id": "e-b2", "type": "set", "cat": "용어 다듬기", "title": "다음 글의 일본어 투 용어 ㉠~㉤을 우리말 순화 표현으로 고쳐 쓰시오.", "passage": "• 고장 난 차량을 ㉠<u>노견</u>에 세웠다.<br>• 장마철에는 한강 ㉡<u>고수부지</u> 출입을 통제한다.<br>• 급여 ㉢<u>구좌</u>를 새로 만들었다.<br>• 월급을 미리 ㉣<u>가불</u>받았다.<br>• 그는 이 부서의 ㉤<u>고참</u>이다.", "blanks": [{"label": "㉠", "accept": ["갓길"], "explain": "노견 → 갓길 (p.27)"}, {"label": "㉡", "accept": ["둔치"], "explain": "고수부지 → 둔치 (p.27)"}, {"label": "㉢", "accept": ["계좌"], "explain": "구좌 → 계좌 (p.27)"}, {"label": "㉣", "accept": ["임시 지급"], "explain": "가불 → 임시 지급 (p.27)"}, {"label": "㉤", "accept": ["선임", "선임자", "선참", "선참자"], "explain": "고참 → 선임, 선임자, 선참, 선참자 (p.27)"}]}, {"id": "e-b3", "type": "set", "cat": "용어 다듬기", "title": "다음 글의 일본어 음차어 ㉠~㉤을 다듬은 말로 고쳐 쓰시오.", "passage": "• 일정이 바뀌어도 ㉠<u>유도리</u> 있게 대처하자.<br>• 출장 전에 짐 ㉡<u>단도리</u>를 단단히 했다.<br>• 연료를 ㉢<u>만땅</u> 채웠다.<br>• 실수를 해서 선배에게 ㉣<u>쿠사리</u>를 들었다.<br>• 새 차에 ㉤<u>기스</u>가 났다.", "blanks": [{"label": "㉠", "accept": ["여유", "융통", "여유분", "늘품"], "explain": "유도리 → 여유, 여유분, 융통, 늘품 (p.27)"}, {"label": "㉡", "accept": ["채비", "단속"], "explain": "단도리 → 채비, 단속 (p.27)"}, {"label": "㉢", "accept": ["가득"], "explain": "만땅 → 가득, 가득채움, 가득참 (p.27)"}, {"label": "㉣", "accept": ["핀잔"], "explain": "쿠사리 → 핀잔 (p.27)"}, {"label": "㉤", "accept": ["흠", "흠집"], "explain": "기스 → 흠, 흠집 (p.28)"}]}, {"id": "e-b4", "type": "set", "cat": "용어 다듬기", "title": "다음 글의 일본어 음차어 ㉠~㉤을 다듬은 말로 고쳐 쓰시오.", "passage": "• 횟집에서 ㉠<u>사시미</u>를 시켰더니 ㉡<u>쓰키다시</u>가 푸짐하게 나왔다.<br>• 회식비를 똑같이 ㉢<u>분빠이</u>했다.<br>• 노래 도중에 ㉣<u>삑사리</u>가 났다.<br>• 그는 계획도 없이 ㉤<u>무데뽀</u>로 밀어붙였다.", "blanks": [{"label": "㉠", "accept": ["생선회"], "explain": "사시미 → 생선회 (p.28)"}, {"label": "㉡", "accept": ["곁들이찬"], "explain": "쓰키다시 → 곁들이찬 (p.27)"}, {"label": "㉢", "accept": ["분배", "노느매기"], "explain": "분빠이하다 → 분배, 노느매기 (p.28)"}, {"label": "㉣", "accept": ["음 이탈", "실수", "헛발질"], "explain": "삑사리 → 실수, 음 이탈, 헛발질 (p.28)"}, {"label": "㉤", "accept": ["막무가내"], "explain": "무데뽀 → 막무가내 (p.27)"}]}, {"id": "e-b5", "type": "set", "cat": "용어 다듬기", "title": "다음 글의 일본어 투 용어 ㉠~㉤을 다듬은 말로 고쳐 쓰시오.", "passage": "• 행사장 입구에 ㉠<u>지라시</u>를 붙였다.<br>• 그 일은 결국 ㉡<u>나가리</u>가 됐다.<br>• 공사 현장에서 ㉢<u>노가다</u>를 했다.<br>• 여름에는 ㉣<u>나시</u>를 즐겨 입는다.<br>• 요리에 ㉤<u>와사비</u>를 곁들였다.", "blanks": [{"label": "㉠", "accept": ["선전지", "낱장 광고"], "explain": "지라시 → 선전지, 낱장 광고 (p.27)"}, {"label": "㉡", "accept": ["무산"], "explain": "나가리 → 무산 (p.27)"}, {"label": "㉢", "accept": ["막노동", "막일"], "explain": "노가다 → 막노동, 막일 (p.27)"}, {"label": "㉣", "accept": ["민소매"], "explain": "나시 → 민소매 (p.27)"}, {"label": "㉤", "accept": ["고추냉이"], "explain": "와사비 → 고추냉이 (p.27)"}]}, {"id": "e-b6", "type": "set", "cat": "용어 다듬기", "title": "다음 글의 외래어·외국어 ㉠~㉤을 다듬은 말로 고쳐 쓰시오.", "passage": "• 부서 간 ㉠<u>브레인스토밍</u>을 진행했다.<br>• 3개년 사업 ㉡<u>로드맵</u>을 발표했다.<br>• 우수 직원에게 ㉢<u>인센티브</u>를 준다.<br>• 자세한 내용은 ㉣<u>홈페이지</u>를 참고하시기 바랍니다.<br>• 안전 점검 ㉤<u>체크리스트</u>를 작성했다.", "blanks": [{"label": "㉠", "accept": ["난상 토론", "발상 모으기"], "explain": "브레인스토밍 → 난상 토론, 발상 모으기 (p.13)"}, {"label": "㉡", "accept": ["이행안", "단계별 이행안"], "explain": "로드맵 → 이행안, 단계별 이행안 (p.13)"}, {"label": "㉢", "accept": ["특전", "성과급"], "explain": "인센티브 → 특전, 성과급 (p.14)"}, {"label": "㉣", "accept": ["누리집"], "explain": "홈페이지 → 누리집 (p.15)"}, {"label": "㉤", "accept": ["점검표"], "explain": "체크리스트 → 점검표 (p.14)"}]}, {"id": "e-b7", "type": "set", "cat": "용어 다듬기", "title": "다음 글의 외래어·외국어 ㉠~㉤을 다듬은 말로 고쳐 쓰시오.", "passage": "• 신도시 개발 ㉠<u>마스터플랜</u>을 수립했다.<br>• 재난 대응 ㉡<u>컨트롤 타워</u> 역할을 맡았다.<br>• 박람회장에서 안내 ㉢<u>브로슈어</u>를 나눠 주었다.<br>• 창업 초기 기업, 곧 ㉣<u>스타트업</u>을 지원한다.<br>• 두 기관이 ㉤<u>MOU</u>를 맺었다.", "blanks": [{"label": "㉠", "accept": ["종합 계획", "기본 계획", "기본 설계"], "explain": "마스터플랜 → 종합 계획, 기본 계획, 기본 설계 (p.13·23)"}, {"label": "㉡", "accept": ["통제탑", "지휘 본부", "사령탑"], "explain": "컨트롤 타워 → 통제탑, 지휘 본부, 사령탑 (p.14)"}, {"label": "㉢", "accept": ["안내서", "소책자"], "explain": "브로슈어 → 안내서, 소책자 (p.13·23)"}, {"label": "㉣", "accept": ["새싹 기업", "신생 기업", "창업 초기 기업"], "explain": "스타트업 → 새싹 기업, 창업 초기 기업, 신생 기업 (p.23)"}, {"label": "㉤", "accept": ["업무 협약", "업무 협정", "양해 각서"], "explain": "MOU → 업무 협정, 업무 협약, 양해 각서 (p.24)"}]}, {"id": "e-b8", "type": "set", "cat": "용어 다듬기", "title": "다음 공문의 어려운 한자어 ㉠~㉤을 쉬운 말로 고쳐 쓰시오.", "passage": "• 위 사항을 ㉠<u>감안하여</u> 결정한다.<br>• 신청서를 ㉡<u>동봉</u>하오니 확인 바랍니다.<br>• ㉢<u>금번</u> 행사에 참석해 주셔서 감사합니다.<br>• 결과 보고서를 관계 기관에 ㉣<u>송부했다</u>.<br>• 업무 효율을 ㉤<u>제고하고자</u> 한다.", "blanks": [{"label": "㉠", "accept": ["고려하여"], "explain": "감안하여 → 고려하여 (p.12)"}, {"label": "㉡", "accept": ["함께 보내", "함께 보냄"], "explain": "동봉 → 함께 보냄 (p.13)"}, {"label": "㉢", "accept": ["이번"], "explain": "금번 → 이번 (p.12·25)"}, {"label": "㉣", "accept": ["보냈다"], "explain": "송부했다고 → 보냈다고 (p.13)"}, {"label": "㉤", "accept": ["높이고자"], "explain": "제고하고 → 높이고 (p.14)"}]}, {"id": "e-b9", "type": "set", "cat": "용어 다듬기", "title": "다음 공문의 한자어 ㉠~㉤을 다듬은 말로 고쳐 쓰시오.", "passage": "• 출입 시 공무원증을 ㉠<u>패용하여야</u> 한다.<br>• 출근 ㉡<u>첨두시</u>에는 셔틀버스를 늘린다.<br>• 신임 청장의 ㉢<u>초도 순시</u>가 예정되어 있다.<br>• ㉣<u>차년도</u> 예산안을 제출했다.<br>• 축제를 ㉤<u>성료</u>했다.", "blanks": [{"label": "㉠", "accept": ["달아야", "차야", "달다", "차다"], "explain": "(공무원증 등을) 패용하다 → 달다, 차다 (p.26)"}, {"label": "㉡", "accept": ["가장 붐빌 때"], "explain": "첨두시 → 가장 붐빌 때 (p.26)"}, {"label": "㉢", "accept": ["첫 방문", "첫 둘러보기"], "explain": "초도 순시 → 첫 방문, 첫 둘러보기 (p.26)"}, {"label": "㉣", "accept": ["다음 해", "다음 연도"], "explain": "차년도 → 다음 해, 다음 연도 (p.26)"}, {"label": "㉤", "accept": ["성공적으로 마침", "성공적으로 마쳤다", "성공적으로 끝", "성대하게 마"], "explain": "성료 → 성공적으로 마침, 성공적으로 끝남, 성대하게 마침 (p.25)"}]}, {"id": "e-b10", "type": "set", "cat": "용어 다듬기", "title": "다음 공문의 한자어 ㉠~㉤을 다듬은 말로 고쳐 쓰시오.", "passage": "• 사무실 문에 ㉠<u>시건장치</u>를 설치했다.<br>• 다른 지역의 ㉡<u>수범 사례</u>를 참고한다.<br>• 병해충 ㉢<u>예찰</u> 활동을 강화한다.<br>• 출입문에 ㉣<u>단차</u>가 있으니 주의하십시오.<br>• 각 층에 ㉤<u>자동 제세동기</u>를 비치했다.", "blanks": [{"label": "㉠", "accept": ["잠금장치", "자물쇠 장치"], "explain": "시건장치 → 잠금장치, 자물쇠 장치 (p.25)"}, {"label": "㉡", "accept": ["모범 사례", "잘된 사례"], "explain": "수범 사례 → 모범 사례, 잘된 사례 (p.25)"}, {"label": "㉢", "accept": ["미리 살피기"], "explain": "예찰 → 미리 살피기 (p.25)"}, {"label": "㉣", "accept": ["높이 차이", "높낮이", "고저 차", "높낮이 차이"], "explain": "단차 → 고저 차, 높이 차이, 높낮이, 높낮이 차이 (p.25)"}, {"label": "㉤", "accept": ["자동 심장 충격기", "심장 충격기"], "explain": "자동 제세동기 → 자동 심장 충격기, 심장 충격기 (p.25)"}]}, {"id": "e-c1", "type": "set", "cat": "어색한 이유", "title": "다음 문장들이 어색한 이유를 고르시오. (응용 문장)", "reasons": true, "passage": "㉠ 문제는 예산이 부족하여 사업이 늦어지고 있다.<br>㉡ 우리 회사가 지역 최고의 기업으로 키워 나가겠습니다.<br>㉢ 이번 겨울 특강은 10개 강좌를 운영할 예정이다.<br>㉣ 앞으로 안전 시설을 확충에 최선을 다하겠습니다.<br>㉤ 따뜻한 이웃들의 이야기로 감동인 영화다.", "blanks": [{"label": "㉠", "options": ["주어와 서술어의 호응", "목적어와 서술어의 호응", "수식어와 피수식어의 호응", "의미의 중복"], "answer": 0, "explain": "'문제는 ~는 점이다'로 호응시킵니다. → 문제는 예산이 부족하여 사업이 늦어지고 있다는 점이다. (p.2 유형)"}, {"label": "㉡", "options": ["조사 오류", "주어와 서술어의 호응", "중의성", "어순 오류"], "answer": 1, "explain": "'키워 나가다'의 대상이므로 '우리 회사를'. (p.2 '우리 시가 → 우리 시를' 유형)"}, {"label": "㉢", "options": ["어휘 사용 오류", "생략", "주어와 서술어의 호응", "접속 오류"], "answer": 2, "explain": "'특강은 ~ 강좌가 운영될 예정이다'. (p.2 여름 특강 유형)"}, {"label": "㉣", "options": ["목적어와 서술어의 호응", "의미의 중복", "어미 오류", "어순 오류"], "answer": 0, "explain": "'시설을 확충에'는 목적어와 서술어가 맞지 않습니다. → 확충하는 데에 (p.3)"}, {"label": "㉤", "options": ["조사 오류", "수식어와 피수식어의 호응", "중의성", "의미의 중복"], "answer": 1, "explain": "관형어 '감동인'이 '영화'와 호응하지 않습니다. → 감동을 주는 (p.3)"}]}, {"id": "e-c2", "type": "set", "cat": "어색한 이유", "title": "다음 문장들이 어색한 이유를 고르시오. (응용 문장)", "reasons": true, "passage": "㉠ 그는 청년 창업가로써 책임을 다하겠다고 말했다.<br>㉡ 시는 국제 도시에 걸맞는 환경을 조성한다.<br>㉢ 사장은 직원들과 고객의 안전에 관하여 논의했다.<br>㉣ 두 기관은 공동 연구 협약 체결과 협력 방안을 논의했다.<br>㉤ 자세한 내용은 누리집 공지사항 또는 고객센터로 문의하면 된다.", "blanks": [{"label": "㉠", "options": ["조사 오류", "어미 오류", "어휘 사용 오류", "주어와 서술어의 호응"], "answer": 0, "explain": "자격 → '로서'. (조사 오류, p.7)"}, {"label": "㉡", "options": ["조사 오류", "어미 오류", "중의성", "생략"], "answer": 1, "explain": "'걸맞은'. (어미 오류, p.6)"}, {"label": "㉢", "options": ["의미의 중복", "어순 오류", "중의성", "접속 오류"], "answer": 2, "explain": "'직원들을 만나 고객의 안전'인지 '직원들과 고객 모두의 안전'인지 모호합니다. (중의성, p.6)"}, {"label": "㉣", "options": ["접속 오류", "생략", "어휘 사용 오류", "목적어와 서술어의 호응"], "answer": 0, "explain": "명사구 '협약 체결'과 '협력 방안을 논의'가 대등하게 이어지지 않습니다. → 협약을 체결하고 협력 방안을 논의했다. (p.4)"}, {"label": "㉤", "options": ["어순 오류", "생략", "중의성", "조사 오류"], "answer": 1, "explain": "'공지사항'에 맞는 서술어가 빠졌습니다. → 공지사항을 참조하거나 (필수 성분 생략, p.5)"}]}, {"id": "e-c3", "type": "set", "cat": "어색한 이유", "title": "다음 문장들이 어색한 이유를 고르시오. (기출 조건: 의미의 중복, 중의적 표현, 잘못된 호응, 성분의 생략, 이중 피동, 잘못된 어휘 사용)", "reasons": true, "passage": "㉠ 설명회에 약 30여 명이 참석했다.<br>㉡ 소방 시설은 매 1년마다 점검한다.<br>㉢ 증상으로 보아 감기로 보여짐.<br>㉣ 행사 기간 동안 주차장을 무료로 개방한다.<br>㉤ 이번 단속으로 잡상 행위를 근절될 수 있습니다.", "blanks": [{"label": "㉠", "options": ["의미의 중복", "이중 피동", "성분의 생략", "잘못된 어휘 사용"], "answer": 0, "explain": "'약'과 '-여'가 겹칩니다. → 약 30명 / 30여 명 (p.19)"}, {"label": "㉡", "options": ["잘못된 호응", "의미의 중복", "중의적 표현", "이중 피동"], "answer": 1, "explain": "'매'와 '-마다'가 겹칩니다. → 1년마다/매년/해마다 (p.17)"}, {"label": "㉢", "options": ["이중 피동", "의미의 중복", "성분의 생략", "잘못된 호응"], "answer": 0, "explain": "'보이다'에 '-어지다'를 또 붙였습니다. → 보임 (p.18)"}, {"label": "㉣", "options": ["중의적 표현", "잘못된 어휘 사용", "의미의 중복", "이중 피동"], "answer": 2, "explain": "'기간'과 '동안'이 겹칩니다. → 기간/동안 (p.16)"}, {"label": "㉤", "options": ["잘못된 호응", "의미의 중복", "이중 피동", "중의적 표현"], "answer": 0, "explain": "'행위를'과 '근절될'이 호응하지 않습니다. → 잡상 행위를 없앨 수 있습니다. (p.20)"}]}, {"id": "e-c4", "type":     list.push({ t: 'mc', kind: 'meaning', f: () => {
      const pool = sameCat(it).map(x => primary(x.after));
      return { ...base, key: 'mean:' + it.id, type: 'mc', stem: `‘${esc(B)}’${josa(B, '을', '를')} 다듬은 말로 알맞은 것은?`, ...mcFrom(A, pool) };
    }});
    list.push({ t: 'mc', kind: 'reverse', f: () => {
      const pool = sameCat(it).map(x => stripNotes(x.before));
      return { ...base, key: 'rev:' + it.id, type: 'mc', stem: `다듬은 말 ‘${esc(A)}’로 바꿔 써야 하는 원래 말은?`, ...mcFrom(B, pool) };
    }});
    list.push({ t: 'input', kind: 'refine', f: () => ({ ...base, key: 'ref:' + it.id, type: 'input', strict: false,
      stem: '밑줄 친 말을 다듬은 말로 고쳐 쓰시오.', given: `<u>${esc(B)}</u>`, accept: alts(it.after, true) }) });
  } else { // sentence
    list.push({ t: 'mc', kind: 'ab', f: () => {
      const a = primary(it.after), options = shuffle([a, B]);
      return { ...base, key: 'sab:' + it.id, type: 'mc', stem: it.group === '어법' ? '둘 중 어법에 맞는 문장은?' : '둘 중 더 잘 다듬은 표현은?', options, answer: options.indexOf(a) };
    }});
    if (it.group === '어법') list.push({ t: 'mc', kind: 'why', f: () => {
      const others = pick(EOBEOP_CATS.filter(c => c !== it.cat), 3), options = shuffle([it.cat, ...others]);
      return { ...base, key: 'why:' + it.id, type: 'mc', stem: '다음 문장이 어색한 이유로 알맞은 것은?', given: ul(it.before), options, answer: options.indexOf(it.cat) };
    }});
    list.push({ t: 'input', kind: 'rewrite', f: () => ({ ...base, key: 'rw:' + it.id, type: 'self',

  }

}
function essaySingle(e) {
  const base = { cat: '원고지 쓰기', group: '원고지', essay: e.id, key: 'es:' + e.id };
  if (e.type === 'ox') return { ...base, type: 'ox', stem: esc(e.q), answer: e.answer, explain: e.explain };
  const options = shuffle(e.options), answer = options.indexOf(e.options[e.answer]);
  return { ...base, type: 'mc', stem: esc(e.q), options, answer, explain: e.explain };
}
function symbolQ(s, dir) {
  const base = { cat: '교정 부호', group: '원고지', sym: s.id, key: 'sym:' + dir + ':' + s.id };
  if (dir === 'm') { const o = mcFrom(s.mean, SYMBOLS.filter(x => x !== s).map(x => x.mean));
    return { ...base, type: 'mc', stem: '다음 교정 부호의 뜻은?', figure: symSvg(s, 'symbig'), ...o, explain: '그림은 소책자의 부호를 단순하게 다시 그린 것이에요. (p.31)' }; }
  const others = pick(SYMBOLS.filter(x => x !== s), 3), opts = shuffle([s, ...others]);
  return { ...base, type: 'mc', stem: `‘${s.mean}’ 쓰는 교정 부호는?`, options: opts.map(x => x.id), optHtml: opts.map(x => symSvg(x)), answer: opts.indexOf(s), explain: '그림은 소책자의 부호를 단순하게 다시 그린 것이에요. (p.31)' };
}
function rebuild(key) {
  const [k, a, b] = key.split(':');
  if (k === 'es') return essaySingle(E_BY_ID[a]);
  if (k === 'sym') return symbolQ(SYMBOLS.find(s => s.id === b), a);
  const it = BY_ID[a]; if (!it) return null;
  const map = { pick: 'pick', ab: 'ab', fix: 'fix', mean: 'meaning', rev: 'reverse', ref: 'refine', sab: 'ab', why: 'why', rw: 'rewrite' };
  const m = makers(it).find(x => x.kind === map[k]); return m ? m.f() : null;
}
function buildSession(cats, style, count) {
  const qs = [];
  const want = t => style === 'mix' || (style === 'mc' ? t === 'mc' : t === 'input');
  for (const it of ITEMS) if (cats.has(it.cat)) {
    const ms = makers(it).filter(m => want(m.t)); if (ms.length) qs.push({ ...ms[Math.random() * ms.length | 0], cat: it.cat });
  }
  if (cats.has('원고지 쓰기') && style !== 'input') for (const e of ESSAY_SINGLES) qs.push({ cat: '원고지 쓰기', f: () => essaySingle(e) });
  if (cats.has('교정 부호') && style !== 'input') for (const s of SYMBOLS) qs.push({ cat: '교정 부호', f: () => symbolQ(s, Math.random() < .5 ? 'm' : 's') });
  // 갈래마다 고르게: 갈래별로 섞은 뒤 돌아가며 하나씩 뽑음
  const byCat = {};
  for (const m of qs) { const c = m.cat || '기타'; (byCat[c] = byCat[c] || []).push(m); }
  const lanes = shuffle(Object.values(byCat).map(shuffle)), out = [];
  while (out.length < count && lanes.some(l => l.length)) for (const l of lanes) { if (l.length && out.length < count) out.push(l.pop()); }
  return shuffle(out).map(m => m.f());
}

const ESSAY_KINDS = ['낱말 고르기', '용어 다듬기', '어색한 이유', '문장 다듬기', '띄어쓰기 고쳐 쓰기'];

function renderEssay(id) {
  let e = E_BY_ID[id]; if (!e) return renderEssayList();
  const list = ESSAY.filter(x => x.cat === e.cat), idx = list.indexOf(e), nextE = list[idx + 1];
  const nav = `<div class="next"><a class="btn" href="#essay">목록</a>${nextE ? `<a class="btn" href="#${nextE.id}">다음 문제</a>` : ''}</div>`;
  const saveDone = txt => { const d = store.get('essayDone', {}); d[e.id] = txt; store.set('essayDone', d); };
  if (e.type === 'set') {
    // 보기 순서를 풀 때마다 섞음 (본문 괄호 속 순서도 함께)
    let ptxt = e.passage;
    e = { ...e, blanks: e.blanks.map(b => {
      if (!b.options) return b;
      const order = shuffle(b.options.map((_, j) => j)), options = order.map(j => b.options[j]);
      if (b.options.length === 2) ptxt = ptxt.replace(`${b.label}(${b.options[0]}/${b.options[1]})`, `${b.label}(${options[0]}/${options[1]})`);
      return { ...b, options, answer: order.indexOf(b.answer) };
    }) };
    const passage = ptxt.replace(/(㉠|㉡|㉢|㉣|㉤)/g, '<b style="color:var(--pen)">$1</b>');
    view.innerHTML = `<div class="qhead"><span><span class="tag">${esc(e.cat)}</span></span><span>${idx + 1} / ${list.length}</span></div>
      <div class="stem">${esc(e.title)}</div><div class="passage">${passage}</div>
      <div class="blanks">${e.blanks.map((b, k) => `<div class="blank" data-b="${k}"><span class="lab">${b.label}</span><div>${b.options
        ? `<div class="choice">${b.options.map((o, j) => `<button data-j="${j}" aria-pressed="false">${esc(o)}</button>`).join('')}</div>`
        : `<input type="text" autocomplete="off" placeholder="고쳐 쓴 말">`}<div class="ans"></div></div></div>`).join('')}</div>
      <div class="next"><button class="primary" id="grade">채점하기</button></div><div id="fb"></div>${nav}`;
    view.querySelectorAll('.choice').forEach(c => c.querySelectorAll('button').forEach(b => b.onclick = () => {
      if (c.dataset.locked) return; c.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); }));
    $('#grade').onclick = () => {
      let right = 0;
      e.blanks.forEach((b, k) => {
        const box = view.querySelector(`[data-b="${k}"]`), ans = $('.ans', box); let ok;
        if (b.options) { const c = $('.choice', box), sel = c.querySelector('[aria-pressed="true"]'); c.dataset.locked = 1;
          ok = sel && +sel.dataset.j === b.answer; c.querySelectorAll('button')[b.answer].classList.add('right'); if (sel && !ok) sel.classList.add('wrong');
          ans.innerHTML = `${ok ? '맞음' : '정답: ' + esc(b.options[b.answer])} · ${esc(b.explain)}`;
        } else { const inp = $('input', box); inp.readOnly = true; ok = looseMatch(inp.value, b.accept);
          ans.innerHTML = `${ok ? '맞음' : '정답 예: ' + b.accept.map(esc).join(', ')} · ${esc(b.explain)}${ok ? '' : ` <button class="linkish" data-ov="${k}">맞은 걸로</button>`}`; }
        ans.className = 'ans ' + (ok ? 'ok' : 'no'); if (ok) right++;
        record({ cat: '서술형 ' + e.cat, key: 'set:' + e.id + ':' + k }, ok);
      });
      const show = () => { $('#fb').innerHTML = `<div class="fb ${right === e.blanks.length ? 'ok' : 'no'}"><div class="verdict">${right} / ${e.blanks.length} 맞음</div><div class="src">빈칸마다 소책자 쪽수를 적어 두었어요.</div></div>`; saveDone(`${right}/${e.blanks.length}`); };
      show(); $('#grade').remove();
      view.querySelectorAll('[data-ov]').forEach(b => b.onclick = () => { right++; const a = b.parentNode; a.className = 'ans ok'; b.remove();
        fixOverride({ cat: '서술형 ' + e.cat, key: 'set:' + e.id + ':' + b.dataset.ov }); show(); });
    };
  } else if (e.type === 'write') {
    view.innerHTML = `<div class="qhead"><span><span class="tag">${esc(e.cat)}</span></span><span>${idx + 1} / ${list.length}</span></div>
      <div class="stem">${esc(e.title)}</div><div class="given">${esc(e.original)}</div>
      <textarea id="ans" placeholder="고쳐 쓴 문장"></textarea>
      <div class="next"><button class="primary" id="reveal">${e.exact ? '채점하기' : '모범 답안 보기'}</button></div><div id="fb"></div>${nav}`;
    $('#reveal').onclick = () => {
      const v = $('#ans').value; $('#ans').readOnly = true; $('#reveal').remove();
      const model = `<div class="model"><b>모범 답안</b><div>${esc(e.model)}</div><ul>${e.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`;
      if (e.exact) { const ok = normSpace(v) === normSpace(e.model); record({ cat: '서술형 ' + e.cat, key: 'w:' + e.id }, ok); saveDone(ok ? '맞음' : '틀림');
        $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><div class="verdict">${ok ? '띄어쓰기까지 정확해요' : '모범 답안과 달라요'}</div>${model}</div>`; }
      else { $('#fb').innerHTML = `<div class="fb">${model}</div><div class="next"><span class="muted" style="margin-right:auto;font-size:14px">고칠 곳을 다 고쳤나요?</span><button id="sx">덜 고쳤어요</button><button class="primary" id="so">다 고쳤어요</button></div>`;
        const go = ok => { record({ cat: '서술형 ' + e.cat, key: 'w:' + e.id }, ok); saveDone(ok ? '맞음' : '틀림'); $('#sx').parentNode.innerHTML = `<span class="muted">${ok ? '맞음으로' : '틀림으로'} 기록했어요.</span>`; };
        $('#so').onclick = () => go(true); $('#sx').onclick = () => go(false); }
    };
  }
  window.scrollTo(0, 0);
}

/* ---------- 소책자 표 ---------- */
let studyQ = '', studyG = '';
function renderStudy() {
  const groups = [...GROUP_ORDER.filter(g => g !== '원고지'), '원고지'];
  const q = studyQ.trim();
  const rows = ITEMS.filter(i => (!studyG || i.group === studyG) && (!q || (plain(i.before) + ' ' + plain(i.after)).includes(q)));
  const showWon = !studyG || studyG === '원고지';
  view.innerHTML = `<section><h2>소책자 표</h2><p class="muted">받아 적은 소책자 내용 전체예요. 검색해서 바로 찾아볼 수 있어요.</p>
    <div class="row" style="margin-top:10px"><input type="text" id="sq" placeholder="찾을 말 (예: 률, 일절, 누리집)" value="${esc(q)}" style="flex:1;min-width:0"></div>
    <div class="chips" style="margin-top:10px"><button class="chip" data-g="" aria-pressed="${!studyG}">전체</button>${groups.map(g => `<button class="chip" data-g="${g}" aria-pressed="${studyG === g}">${g}</button>`).join('')}</div></section>
    ${showWon && !q ? `<section><h3>원고지 교정 부호 (p.31)</h3>${SYMBOLS.map(s => `<div class="symrow">${symSvg(s)}<span>${esc(s.mean)}</span></div>`).join('')}
      <p class="muted" style="font-size:13px">그림은 소책자 부호를 단순하게 다시 그린 것이라 실제 모양과 조금 다를 수 있어요.</p></section>` : ''}
    <section><h3>${rows.length}줄</h3><div class="tblwrap"><table class="tbl">${rows.slice(0, 700).map(i => `<tr><td class="b">${ul(i.before)}</td><td>${ul(i.after)}<span class="note">${esc(i.cat)}${i.note ? ' · ' + esc(i.note) : ''}</span></td><td class="p">${i.page ? i.page + '쪽' : ''}</td></tr>`).join('')}</table></div></section>`;
  const inp = $('#sq'); inp.oninput = () => { studyQ = inp.value; const pos = inp.selectionStart; renderStudy(); const n = $('#sq'); n.focus(); n.setSelectionRange(pos, pos); };
  view.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { studyG = b.dataset.g; renderStudy(); });
}

route();
</script>
